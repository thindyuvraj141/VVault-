name: Generate Release Keystore (run once)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JDK (same version used to build/sign the app)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore vvault-release.jks \
            -alias vvault \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "iCDKbliJZC7qrtt7bVbW" \
            -keypass "iCDKbliJZC7qrtt7bVbW" \
            -dname "CN=V Vault, OU=App, O=VVault, C=IN"

      - name: Base64 encode
        run: base64 -w 0 vvault-release.jks > vvault-release.jks.base64

      - name: Show fingerprint
        run: keytool -list -v -keystore vvault-release.jks -alias vvault -storepass "iCDKbliJZC7qrtt7bVbW"

      - name: Upload keystore + base64
        uses: actions/upload-artifact@v4
        with:
          name: vvault-keystore
          path: |
            vvault-release.jks
            vvault-release.jks.base64
