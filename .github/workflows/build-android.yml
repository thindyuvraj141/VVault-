name: Build Native Android App (Capacitor)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          else
            echo "No package.json found at repo root — Capacitor project is not set up here."
            exit 1
          fi

      - name: Build web assets (if a build script exists)
        run: |
          if npm run | grep -q " build"; then
            npm run build
          else
            echo "No 'build' script in package.json — skipping."
          fi

      - name: Ensure Android platform exists
        run: |
          if [ ! -d "android" ]; then
            echo "No android/ folder found — adding Capacitor Android platform."
            npx cap add android
          fi

      - name: Prepare app icon source
        run: |
          mkdir -p assets
          if [ -f icon-512.png ]; then
            cp icon-512.png assets/icon.png
          elif [ -f icon-192.png ]; then
            cp icon-192.png assets/icon.png
          fi

      - name: Generate app icons
        run: |
          if [ -f assets/icon.png ]; then
            npx @capacitor/assets generate --android --iconBackgroundColor '#E4EEFC' --iconBackgroundColorDark '#0B0D10'
          else
            echo "No icon source found (icon-512.png / icon-192.png) — skipping icon generation."
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Restore cached keystore
        id: cache-keystore
        uses: actions/cache@v4
        with:
          path: keystore-cache
          key: vvault-release-keystore-v1

      - name: Generate keystore (first run only)
        if: steps.cache-keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p keystore-cache
          keytool -genkeypair -v \
            -keystore keystore-cache/vvault-release.jks \
            -alias ${{ secrets.KEY_ALIAS }} \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -dname "CN=V Vault, OU=App, O=VVault, C=IN"

      - name: Build release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/keystore-cache/vvault-release.jks" \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vvault-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload keystore backup (save this somewhere safe!)
        uses: actions/upload-artifact@v4
        with:
          name: vvault-keystore-backup
          path: keystore-cache/vvault-release.jks
