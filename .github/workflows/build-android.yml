name: Build Native Android App (Capacitor)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Confirm Android SDK is already on this runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Create Capacitor project
        run: |
          mkdir -p capacitor-app/www
          cp index.html manifest.json sw.js icon-*.png capacitor-app/www/
          cd capacitor-app
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Write Capacitor config
        working-directory: capacitor-app
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.vvault.app",
            "appName": "V Vault",
            "webDir": "www",
            "android": {
              "allowMixedContent": false
            }
          }
          EOF

      - name: Add Android platform
        working-directory: capacitor-app
        run: npx cap add android

      - name: Sync web assets into the Android project
        working-directory: capacitor-app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: capacitor-app/android
        run: chmod +x ./gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vvault-android-app
          path: capacitor-app/android/app/build/outputs/apk/debug/app-debug.apk
