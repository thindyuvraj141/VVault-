name: Build Native Android App (Capacitor)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          else
            echo "No package.json found at repo root — Capacitor project is not set up here."
            exit 1
          fi

      - name: Build web assets (if a build script exists)
        run: |
          if npm run | grep -q " build"; then
            npm run build
          else
            echo "No 'build' script in package.json — skipping."
          fi

      - name: Ensure Android platform exists
        run: |
          if [ ! -d "android" ]; then
            echo "No android/ folder found — adding Capacitor Android platform."
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/vvault-release.jks

      - name: Build release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=vvault-release.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vvault-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
